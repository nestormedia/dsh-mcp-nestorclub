# dsh-mcp-nestorclub — bundle patch: the rows that connect the nestorclub MCP server.
#
# 1. mcp-nestorclub       — the shipped @deepseek-ai/dsh-mcp-client bridge with
#                           the Streamable HTTP transport. Its config carries no
#                           x-api-key header: the key belongs to the person using
#                           the plugin, not to this repository. Add it on the
#                           plugin's own page in the Web Plugins list, or with
#                           /mcp-key, and the plugin saves it as a profile
#                           override through the config editor.
# 2. mcp-nestorclub-host  — this package's own Host half: the key card, the
#                           /mcp-key command, and the /mcp-nestorclub JSON API.
- insert:
    - id: mcp-nestorclub
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: web
        transport: streamable-http
        url: https://mcp.nestorclub.com
        failOnStartupError: false
    - id: mcp-nestorclub-host
      name: 'dsh-mcp-nestorclub'
